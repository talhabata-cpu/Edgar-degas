<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sunnah Path | Daily Sunnah Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep:     #0c1f1b;
            --bg-mid:      #122820;
            --bg-card:     rgba(255,255,255,0.055);
            --gold:        #d4af37;
            --gold-soft:   rgba(212,175,55,0.18);
            --gold-border: rgba(212,175,55,0.28);
            --green-light: #b8d4ae;
            --text:        #f0ece0;
            --text-muted:  #8fa889;
            --radius-card: 22px;
            --radius-pill: 50px;
            --shadow:      0 8px 40px rgba(0,0,0,0.35);
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            background: var(--bg-deep);
            background-image:
                radial-gradient(ellipse 80% 60% at 20% 0%, rgba(30,80,60,0.45) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 100%, rgba(212,175,55,0.06) 0%, transparent 55%);
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            min-height: 100vh;
        }

        /* ── HEADER ──────────────────────────────────────── */
        .header {
            max-width: 1300px;
            margin: 0 auto;
            padding: 28px 28px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header-brand { display:flex; align-items:center; gap:14px; }
        .brand-icon {
            width:52px; height:52px; background:var(--gold-soft);
            border:1px solid var(--gold-border); border-radius:14px;
            display:flex; align-items:center; justify-content:center;
            font-size:1.4rem; color:var(--gold);
        }
        .brand-text h1 {
            font-family: 'Playfair Display', serif;
            font-size:1.7rem; font-weight:700; letter-spacing:0.01em;
        }
        .brand-text p { font-size:0.8rem; color:var(--text-muted); margin-top:2px; }

        .header-stats {
            display:flex; gap:12px;
        }
        .stat-pill {
            background:var(--gold-soft); border:1px solid var(--gold-border);
            border-radius:var(--radius-pill); padding:8px 18px;
            font-size:0.78rem; font-weight:600; color:var(--gold);
            display:flex; align-items:center; gap:7px;
        }

        /* ── SEARCH ──────────────────────────────────────── */
        .search-wrap {
            max-width:1300px; margin:28px auto 0; padding:0 28px;
        }
        .search-box {
            background:rgba(255,255,255,0.07);
            border:1px solid var(--gold-border);
            border-radius:var(--radius-pill);
            display:flex; align-items:center; gap:14px;
            padding:0 22px; transition:border-color .25s, box-shadow .25s;
        }
        .search-box:focus-within {
            border-color:var(--gold);
            box-shadow:0 0 0 3px rgba(212,175,55,0.12);
        }
        .search-box i { color:var(--gold); font-size:1rem; }
        .search-box input {
            flex:1; background:none; border:none; outline:none;
            padding:15px 0; color:var(--text); font-size:0.95rem;
            font-family:'DM Sans',sans-serif;
        }
        .search-box input::placeholder { color:var(--text-muted); }
        #clearSearch {
            background:none; border:none; color:var(--text-muted);
            cursor:pointer; padding:4px; display:none; font-size:0.85rem;
            transition:color .2s;
        }
        #clearSearch:hover { color:var(--gold); }

        /* ── CATEGORIES ──────────────────────────────────── */
        .cats-wrap {
            max-width:1300px; margin:20px auto 0; padding:0 28px;
            display:flex; gap:10px; overflow-x:auto; padding-bottom:4px;
            scrollbar-width:none;
        }
        .cats-wrap::-webkit-scrollbar { display:none; }
        .cat-btn {
            background:rgba(255,255,255,0.06);
            border:1px solid var(--gold-border);
            border-radius:var(--radius-pill); padding:10px 20px;
            color:var(--text); font-size:0.82rem; font-weight:500;
            cursor:pointer; white-space:nowrap;
            transition:all .22s; display:flex; align-items:center; gap:8px;
            font-family:'DM Sans',sans-serif;
        }
        .cat-btn i { color:var(--gold); font-size:0.85rem; }
        .cat-btn:hover { background:var(--gold-soft); border-color:var(--gold); }
        .cat-btn.active {
            background:var(--gold); border-color:var(--gold);
            color:#0c1f1b; font-weight:600;
        }
        .cat-btn.active i { color:#0c1f1b; }

        /* ── GRID ────────────────────────────────────────── */
        .grid-wrap {
            max-width:1300px; margin:28px auto 0; padding:0 28px 60px;
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(360px, 1fr));
            gap:22px;
        }

        /* ── CARD ────────────────────────────────────────── */
        .card {
            background:var(--bg-card);
            border:1px solid rgba(255,255,255,0.07);
            border-radius:var(--radius-card);
            padding:22px;
            transition:transform .25s, border-color .25s, box-shadow .25s;
            position:relative; overflow:hidden;
        }
        .card::before {
            content:''; position:absolute; inset:0;
            border-radius:var(--radius-card);
            background:linear-gradient(135deg,rgba(212,175,55,0.04),transparent 60%);
            pointer-events:none;
        }
        .card:hover {
            transform:translateY(-4px);
            border-color:var(--gold-border);
            box-shadow:var(--shadow);
        }

        .card-top {
            display:flex; justify-content:space-between;
            align-items:center; margin-bottom:14px;
        }
        .cat-tag {
            background:var(--gold-soft); border:1px solid var(--gold-border);
            border-radius:var(--radius-pill); padding:4px 13px;
            font-size:0.72rem; font-weight:600; color:var(--gold);
            display:flex; align-items:center; gap:6px;
        }
        .card-actions { display:flex; gap:8px; }
        .icon-btn {
            width:34px; height:34px; border-radius:50%;
            background:rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.1);
            color:var(--gold); cursor:pointer; font-size:0.8rem;
            display:flex; align-items:center; justify-content:center;
            transition:all .2s;
        }
        .icon-btn:hover { background:var(--gold); color:#0c1f1b; border-color:var(--gold); transform:scale(1.08); }

        .card-title {
            font-family:'Playfair Display', serif;
            font-size:1.2rem; font-weight:600; color:#fff;
            margin-bottom:9px; line-height:1.3;
        }
        .card-desc {
            font-size:0.88rem; color:var(--text-muted);
            line-height:1.65; margin-bottom:16px;
        }

        /* ── DUA BOX ─────────────────────────────────────── */
        .dua-box {
            background:rgba(212,175,55,0.06);
            border:1px solid var(--gold-border);
            border-radius:14px; padding:16px;
        }
        .dua-arabic {
            font-family:'Amiri', serif;
            font-size:1.25rem; line-height:2;
            direction:rtl; text-align:right;
            color:#fff; margin-bottom:10px;
        }
        .dua-trans {
            font-size:0.8rem; color:var(--text-muted);
            font-style:italic; line-height:1.5; margin-bottom:14px;
        }
        .dua-btns { display:flex; gap:8px; flex-wrap:wrap; }
        .dua-btn {
            background:rgba(212,175,55,0.12);
            border:1px solid var(--gold-border);
            border-radius:var(--radius-pill);
            padding:6px 14px; font-size:0.75rem; font-weight:500;
            color:var(--gold); cursor:pointer;
            display:flex; align-items:center; gap:6px;
            transition:all .2s; font-family:'DM Sans',sans-serif;
        }
        .dua-btn:hover { background:var(--gold); color:#0c1f1b; border-color:var(--gold); }
        .dua-btn:active { transform:scale(0.96); }
        .dua-btn.playing { background:var(--gold); color:#0c1f1b; border-color:var(--gold); }
        .dua-btn .spin { animation:spin .7s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }

        .card-reward {
            margin-top:12px; font-size:0.73rem; color:var(--gold);
            display:flex; align-items:center; gap:6px;
        }

        /* ── TOAST ───────────────────────────────────────── */
        #toast {
            position:fixed; bottom:28px; right:28px;
            background:var(--gold); color:#0c1f1b;
            padding:11px 22px; border-radius:var(--radius-pill);
            font-size:0.85rem; font-weight:600;
            display:none; align-items:center; gap:9px;
            box-shadow:0 4px 20px rgba(0,0,0,0.3);
            animation:slideUp .3s ease; z-index:9999;
        }
        @keyframes slideUp {
            from { transform:translateY(20px); opacity:0; }
            to   { transform:translateY(0);    opacity:1; }
        }

        /* ── NOW PLAYING BAR ─────────────────────────────── */
        #nowPlaying {
            position:fixed; bottom:28px; left:28px;
            background:rgba(12,31,27,0.95);
            backdrop-filter:blur(12px);
            border:1px solid var(--gold-border);
            border-radius:var(--radius-pill);
            padding:10px 18px; display:none; align-items:center; gap:12px;
            font-size:0.82rem; color:var(--gold); z-index:9999;
            box-shadow:var(--shadow);
        }
        #nowPlaying .pulse {
            width:8px; height:8px; border-radius:50%; background:var(--gold);
            animation:pulse 1s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { opacity:1; transform:scale(1); }
            50%      { opacity:.4; transform:scale(0.7); }
        }
        .stop-now { background:none; border:none; color:var(--text-muted);
            cursor:pointer; font-size:0.9rem; padding:2px 4px;
            transition:color .2s; }
        .stop-now:hover { color:#ff6b6b; }

        /* ── FOOTER QUOTE ────────────────────────────────── */
        .quote-bar {
            max-width:1300px; margin:0 auto; padding:0 28px 60px;
        }
        .quote-inner {
            background:var(--gold-soft); border:1px solid var(--gold-border);
            border-radius:var(--radius-card); padding:24px 30px;
            text-align:center;
        }
        .quote-inner .qi { color:var(--gold); font-size:1.3rem; margin-bottom:10px; }
        .quote-inner p { font-family:'Playfair Display',serif; font-size:1rem; line-height:1.7; }
        .quote-inner small { color:var(--text-muted); font-size:0.8rem; margin-top:6px; display:block; }

        /* ── VOICE STATUS BANNER ─────────────────────────── */
        #voiceBanner {
            max-width:1300px; margin:14px auto 0; padding:0 28px;
            display:none;
        }
        .voice-note {
            background:rgba(212,175,55,0.08); border:1px solid var(--gold-border);
            border-radius:12px; padding:10px 16px;
            font-size:0.78rem; color:var(--text-muted);
            display:flex; align-items:center; gap:10px;
        }
        .voice-note i { color:var(--gold); }

        /* ── RESPONSIVE ──────────────────────────────────── */
        @media (max-width:680px) {
            .header { padding:20px 16px 0; }
            .search-wrap, .cats-wrap, .grid-wrap, .quote-bar { padding-left:16px; padding-right:16px; }
            .grid-wrap { grid-template-columns:1fr; }
            .header-stats { display:none; }
            #toast { right:16px; bottom:16px; }
            #nowPlaying { left:16px; bottom:16px; }
        }

        .empty {
            grid-column:1/-1; text-align:center;
            padding:60px 20px; color:var(--text-muted);
        }
        .empty i { font-size:2.5rem; margin-bottom:14px; display:block; color:var(--gold-border); }
    </style>
</head>
<body>

<!-- HEADER -->
<header class="header">
    <div class="header-brand">
        <div class="brand-icon"><i class="fas fa-mosque"></i></div>
        <div class="brand-text">
            <h1>Sunnah Path</h1>
            <p>Following the Way of the Prophet ﷺ</p>
        </div>
    </div>
    <div class="header-stats">
        <div class="stat-pill"><i class="fas fa-book-open"></i> <span id="totalCount">0</span> Practices</div>
        <div class="stat-pill"><i class="fas fa-star"></i> Daily Guide</div>
    </div>
</header>

<!-- VOICE BANNER (shown if no Arabic voice) -->
<div id="voiceBanner">
    <div class="voice-note">
        <i class="fas fa-info-circle"></i>
        <span id="voiceBannerText">Loading voice status…</span>
    </div>
</div>

<!-- SEARCH -->
<div class="search-wrap">
    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search sunnah practices or duas…" autocomplete="off">
        <button id="clearSearch" title="Clear"><i class="fas fa-times"></i></button>
    </div>
</div>

<!-- CATEGORIES -->
<div class="cats-wrap" id="catsContainer"></div>

<!-- GRID -->
<div class="grid-wrap" id="sunnahGrid"></div>

<!-- QUOTE -->
<div class="quote-bar">
    <div class="quote-inner">
        <div class="qi"><i class="fas fa-quote-right"></i></div>
        <p>"Indeed, in the Messenger of Allah you have an excellent example for whoever has hope in Allah and the Last Day."</p>
        <small>— Qur'an 33:21</small>
    </div>
</div>

<!-- TOAST -->
<div id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg">Done!</span></div>

<!-- NOW PLAYING -->
<div id="nowPlaying">
    <div class="pulse"></div>
    <span id="npText">Playing…</span>
    <button class="stop-now" onclick="stopAll()" title="Stop"><i class="fas fa-times"></i></button>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   DATA
═══════════════════════════════════════════════════════════ */

═══════════════════════════════════════════════════════════ */
let synth = window.speechSynthesis;
let currentBtn = null;

let voicesLoaded = false;

function loadVoices() {
    const voices = synth.getVoices();
    if (!voices.length) return;
    voicesLoaded = true;

    // Priority order for Arabic voices
    const arPriority = ['ar-SA','ar-EG','ar-AE','ar-KW','ar-MA','ar'];
    for (const lang of arPriority) {
        const v = voices.find(v => v.lang.toLowerCase().startsWith(lang.toLowerCase()));
        if (v) { arabicVoice = v; break; }
    }
    // Fallback: any voice with 'arab' in name
    if (!arabicVoice) {
        arabicVoice = voices.find(v => v.name.toLowerCase().includes('arab') || v.name.toLowerCase().includes('مريم'));
    }

    // English voice
    englishVoice = voices.find(v => v.lang === 'en-US' && v.localService) ||
                   voices.find(v => v.lang.startsWith('en'));

    // Show banner
    const banner = document.getElementById('voiceBanner');
    const bannerText = document.getElementById('voiceBannerText');
    if (arabicVoice) {
        banner.style.display = 'none';
    } else {
        banner.style.display = 'block';
        bannerText.innerHTML = `<strong>Arabic voice not found on this device.</strong> The "Recite" button will spell out transliteration instead. For Arabic audio, enable an Arabic language pack in your device/browser settings.`;
    }
}

// Voices load async — try immediately and on event
if (synth) {
    loadVoices();
    synth.onvoiceschanged = loadVoices;
    // Some browsers need a small delay
    setTimeout(loadVoices, 500);
    setTimeout(loadVoices, 1500);
}

function stopAll() {
    if (synth) synth.cancel();
    if (currentBtn) { resetBtn(currentBtn); currentBtn = null; }
    document.getElementById('nowPlaying').style.display = 'none';
}

function resetBtn(btn) {
    btn.classList.remove('playing');
    const icon = btn.querySelector('i');
    if (icon) { icon.className = btn.dataset.iconClass || 'fas fa-volume-up'; icon.classList.remove('spin'); }
}

function speak(text, lang, btn, label) {
    if (!synth) { showToast('Speech not supported in this browser'); return; }

    // If already playing this button → stop
    if (currentBtn === btn) { stopAll(); return; }

    stopAll();

    const utt = new SpeechSynthesisUtterance(text);

    if (lang === 'ar') {
        if (arabicVoice) {
            utt.voice = arabicVoice;
            utt.lang  = arabicVoice.lang;
        } else {
            // No Arabic voice: fall back to transliteration spoken in English
            // We don't just silently fail — we show a toast and speak fallback
            showToast('No Arabic voice — playing transliteration');
            const fallback = btn.closest('.dua-box')?.querySelector('.dua-trans')?.textContent || text;
            speak(fallback, 'en', btn, label);
            return;
        }
        utt.rate  = 0.82;
        utt.pitch = 1.05;
    } else {
        if (englishVoice) utt.voice = englishVoice;
        utt.lang  = 'en-US';
        utt.rate  = 0.92;
        utt.pitch = 1;
    }

    utt.onstart = () => {
        currentBtn = btn;
        btn.classList.add('playing');
        const icon = btn.querySelector('i');
        if (icon) { btn.dataset.iconClass = icon.className; icon.className = 'fas fa-circle-notch spin'; }
        const np = document.getElementById('nowPlaying');
        document.getElementById('npText').textContent = label || 'Playing…';
        np.style.display = 'flex';
    };

    const onDone = () => {
        if (currentBtn === btn) { resetBtn(btn); currentBtn = null; }
        document.getElementById('nowPlaying').style.display = 'none';
    };
    utt.onend   = onDone;
    utt.onerror = (e) => {
        onDone();
        if (e.error !== 'interrupted') showToast('Audio error — try again');
    };

    synth.speak(utt);
}

/* ═══════════════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════════════ */
let toastTimer;
function showToast(msg) {
    clearTimeout(toastTimer);
    document.getElementById('toastMsg').textContent = msg;
    const t = document.getElementById('toast');
    t.style.display = 'flex';
    toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2600);
}

/* ═══════════════════════════════════════════════════════════
   REMINDERS
═══════════════════════════════════════════════════════════ */
function setReminder(title) {
    showToast('Reminder set for: ' + title);
    if (Notification.permission === 'granted') {
        new Notification('Sunnah Reminder: ' + title, {
            body: 'May Allah bless your commitment to the Sunnah.',
        });
    } else if (Notification.permission !== 'denied') {
        Notification.requestPermission();
    }
}

/* ═══════════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════════ */
const CAT_ICONS = {
    'All':'fa-list', 'Morning':'fa-sun', 'Prayer':'fa-mosque',
    'Eating & Drinking':'fa-utensils', 'Sleeping':'fa-bed',
    'Travel':'fa-plane', 'Home':'fa-home', 'Clothing':'fa-shirt',
    'Daily Etiquette':'fa-hands', 'Sneezing':'fa-wind'
};

function catIcon(c) { return CAT_ICONS[c] || 'fa-book'; }

function initCats() {
    const cats = ['All', ...new Set(SUNNAH.map(s => s.category))];
    const el = document.getElementById('catsContainer');
    el.innerHTML = cats.map((c, i) => `
        <button class="cat-btn${i===0?' active':''}" data-cat="${c}">
            <i class="fas ${catIcon(c)}"></i>${c}
        </button>`).join('');
    el.querySelectorAll('.cat-btn').forEach(b => b.addEventListener('click', () => {
        el.querySelectorAll('.cat-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        render();
    }));
}

function getFiltered() {
    const cat   = document.querySelector('.cat-btn.active')?.dataset.cat || 'All';
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    return SUNNAH.filter(s => {
        const matchCat = cat === 'All' || s.category === cat;
        const matchQ   = !query ||
            s.title.toLowerCase().includes(query) ||
            s.desc.toLowerCase().includes(query)  ||
            s.trans.toLowerCase().includes(query) ||
            s.arabic.includes(query);
        return matchCat && matchQ;
    });
}

function render() {
    const items = getFiltered();
    const grid  = document.getElementById('sunnahGrid');

    if (!items.length) {
        grid.innerHTML = `<div class="empty">
            <i class="fas fa-search"></i>
            <p>No practices found</p>
            <small>Try a different search term or category</small>
        </div>`;
        return;
    }

    grid.innerHTML = items.map(s => `
        <div class="card" data-id="${s.id}">
            <div class="card-top">
                <span class="cat-tag"><i class="fas ${catIcon(s.category)}"></i>${s.category}</span>
                <div class="card-actions">
                    <button class="icon-btn" onclick="setReminder('${esc(s.title)}')" title="Set Reminder">
                        <i class="fas fa-bell"></i>
                    </button>
                    <button class="icon-btn" onclick="speak('${esc(s.title)}. ${esc(s.desc)}','en',this,'📖 Reading description…')" title="Read description">
                        <i class="fas fa-headphones"></i>
                    </button>
                </div>
            </div>
            <div class="card-title">${s.title}</div>
            <div class="card-desc">${s.desc}</div>
            <div class="dua-box">
                <div class="dua-arabic">${s.arabic}</div>
                <div class="dua-trans">${s.trans}</div>
                <div class="dua-btns">
                    <button class="dua-btn" onclick="speak('${esc(s.arabic)}','ar',this,'🕌 Reciting Arabic dua…')" title="Recite Arabic">
                        <i class="fas fa-volume-up"></i> Recite (Arabic)
                    </button>
                    <button class="dua-btn" onclick="speak('${esc(s.trans)}','en',this,'📖 Translation…')" title="Read translation">
                        <i class="fas fa-language"></i> Translation
                    </button>
                    <button class="dua-btn" onclick="copyText('${esc(s.arabic)}\\n${esc(s.trans)}')" title="Copy dua">
                        <i class="fas fa-copy"></i> Copy
                    </button>
                </div>
            </div>
            ${s.reward ? `<div class="card-reward"><i class="fas fa-star"></i>${s.reward}</div>` : ''}
        </div>
    `).join('');
}

// Safe escape for inline event strings
function esc(str) {
    return str.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

function copyText(text) {
    const decoded = text.replace(/\\n/g, '\n').replace(/\\'/g,"'");
    navigator.clipboard.writeText(decoded)
        .then(() => showToast('Dua copied to clipboard ✓'))
        .catch(() => showToast('Copy failed'));
}

/* ═══════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════ */
document.getElementById('totalCount').textContent = SUNNAH.length;
initCats();
render();

const searchInput = document.getElementById('searchInput');
const clearBtn    = document.getElementById('clearSearch');

searchInput.addEventListener('input', () => {
    clearBtn.style.display = searchInput.value ? 'block' : 'none';
    render();
});
clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.style.display = 'none';
    render();
});

// Request notification permission after 2s
setTimeout(() => {
    if (Notification.permission === 'default') Notification.requestPermission();
}, 2000);

// Expose globals for inline handlers
window.speak       = speak;
window.stopAll     = stopAll;
window.setReminder = setReminder;
window.copyText    = copyText;
</script>
</body>
</html>
